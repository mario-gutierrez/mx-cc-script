<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MX Creative Console Keypad Demo</title>
    <style>
        :root {
            color-scheme: dark;
            --ink: #f5f2eb;
            --muted: #aca9a2;
            --panel: rgba(24, 25, 27, 0.88);
            --line: rgba(255, 255, 255, 0.13);
            --accent: #66e28a;
            --signal: #f3b84b;
            font-family: "Aptos Display", "Segoe UI Variable", sans-serif;
        }

        * { box-sizing: border-box; }

        body {
            min-height: 100vh;
            margin: 0;
            color: var(--ink);
            background:
                linear-gradient(135deg, rgba(243, 184, 75, 0.08), transparent 42%),
                repeating-linear-gradient(90deg, transparent 0 39px, rgba(255, 255, 255, 0.025) 40px),
                #111214;
        }

        main {
            width: min(100% - 32px, 980px);
            min-height: 100vh;
            margin: auto;
            display: grid;
            grid-template-columns: minmax(300px, 440px) minmax(280px, 1fr);
            align-items: center;
            gap: clamp(28px, 6vw, 72px);
            padding: 32px 0;
        }

        .device-stage {
            position: relative;
            width: min(100%, 380px);
            aspect-ratio: 842 / 981;
            justify-self: center;
            user-select: none;
        }

        .device-stage > img {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: contain;
            filter: drop-shadow(0 28px 34px rgba(0, 0, 0, 0.48));
        }

        .key, .page-key {
            position: absolute;
            border: 2px solid transparent;
            transition: border-color 120ms ease, box-shadow 120ms ease, transform 120ms ease;
        }

        .key {
            padding: 0;
            overflow: hidden;
            border-radius: 8%;
            background: #050505;
            cursor: pointer;
        }

        .key img { width: 100%; height: 100%; display: block; object-fit: cover; }
        .key:hover { border-color: rgba(243, 184, 75, 0.75); }
        .key:disabled { cursor: default; }
        .key.active, .page-key.active {
            border-color: var(--accent);
            box-shadow: 0 0 18px rgba(102, 226, 138, 0.72);
            transform: scale(0.97);
        }

        .page-key { border-radius: 26%; pointer-events: none; }

        .controls {
            align-self: center;
            border-left: 1px solid var(--line);
            padding-left: clamp(24px, 5vw, 56px);
        }

        .eyebrow {
            margin: 0 0 10px;
            color: var(--signal);
            font: 700 0.75rem/1.2 Consolas, monospace;
            text-transform: uppercase;
        }

        h1 { margin: 0; max-width: 11ch; font-size: clamp(2.1rem, 6vw, 4.6rem); line-height: 0.96; letter-spacing: 0; }
        .summary { max-width: 38ch; margin: 22px 0; color: var(--muted); line-height: 1.55; }

        #connect {
            min-height: 44px;
            padding: 0 18px;
            border: 1px solid #8df0a9;
            border-radius: 6px;
            color: #07140b;
            background: var(--accent);
            font: inherit;
            font-weight: 700;
            cursor: pointer;
        }

        #connect:disabled { opacity: 0.55; cursor: default; }

        #status {
            min-height: 76px;
            margin-top: 18px;
            padding: 14px;
            border: 1px solid var(--line);
            border-radius: 6px;
            background: var(--panel);
            color: #d8d6d0;
            font: 0.82rem/1.5 Consolas, monospace;
            white-space: pre-wrap;
        }

        #status.error { border-color: #e57167; color: #ffb6ae; }

        @media (max-width: 740px) {
            main { grid-template-columns: 1fr; gap: 18px; padding-top: 24px; }
            .device-stage { width: min(78vw, 340px); }
            .controls { border-left: 0; border-top: 1px solid var(--line); padding: 24px 0 0; }
            h1 { max-width: none; font-size: clamp(2rem, 12vw, 3.4rem); }
        }
    </style>
</head>
<body>
    <main>
        <div class="device-stage" id="device" aria-label="Interactive MX Creative Console keypad">
            <img src="./assets/mx-keypad.png" alt="Logitech MX Creative Console keypad">
            <span class="page-key" id="key-9"></span>
            <span class="page-key" id="key-10"></span>
        </div>

        <section class="controls">
            <p class="eyebrow">WebHID / Keypad</p>
            <h1>Creative Console</h1>
            <p class="summary">Connect a keypad, press a physical key to highlight it, or select one of the nine displays to send a new color tile.</p>
            <button id="connect" type="button">Connect keypad</button>
            <div id="status" role="status" aria-live="polite">Checking browser support...</div>
        </section>
    </main>

    <script src="../js/mx-creative-console.min.js"></script>
    <script>
        const { MXCreativeConsoleClient } = window.MXCreativeConsole;
        const client = new MXCreativeConsoleClient();
        const connectButton = document.getElementById('connect');
        const device = document.getElementById('device');
        const status = document.getElementById('status');
        const previewUrls = new Map();
        let connected = false;
        let previousPressed = new Set();

        const layout = {
            key: { width: 162 / 842, height: 162 / 981 },
            keys: [
                [120, 120], [334, 120], [548, 120],
                [120, 334], [334, 334], [548, 334],
                [120, 548], [334, 548], [548, 548]
            ],
            paging: [
                { left: 120 / 842, top: 775 / 981, width: 183 / 842, height: 95 / 981 },
                { left: 331 / 842, top: 775 / 981, width: 183 / 842, height: 95 / 981 }
            ]
        };

        const controlIdToIndex = new Map([
            [0x0001, 0], [0x0002, 1], [0x0003, 2], [0x0004, 3], [0x0005, 4],
            [0x0006, 5], [0x0007, 6], [0x0008, 7], [0x0009, 8],
            [0x01a1, 9], [0x01a2, 10]
        ]);

        function setStatus(message, isError = false) {
            status.textContent = message;
            status.classList.toggle('error', isError);
        }

        function createTile(index, hue) {
            const canvas = document.createElement('canvas');
            canvas.width = 118;
            canvas.height = 118;
            const context = canvas.getContext('2d');
            context.fillStyle = `hsl(${hue} 78% 43%)`;
            context.fillRect(0, 0, 118, 118);
            context.fillStyle = '#fff';
            context.font = '700 42px Aptos, sans-serif';
            context.textAlign = 'center';
            context.textBaseline = 'middle';
            context.fillText(String(index + 1), 59, 59);
            return new Promise((resolve, reject) => canvas.toBlob(
                (blob) => blob ? resolve(blob) : reject(new Error('Could not encode the key image.')),
                'image/jpeg',
                0.9
            ));
        }

        function showPreview(index, blob) {
            const previousUrl = previewUrls.get(index);
            if (previousUrl) URL.revokeObjectURL(previousUrl);
            const url = URL.createObjectURL(blob);
            previewUrls.set(index, url);
            document.getElementById(`preview-${index}`).src = url;
        }

        async function updateKey(index, hue = Math.random() * 360, upload = true) {
            const blob = await createTile(index, hue);
            showPreview(index, blob);
            if (upload) {
                const file = new File([blob], `key-${index + 1}.jpg`, { type: 'image/jpeg' });
                await client.uploadContextualDisplayImage(file, { mode: 'single', keyNumber: index + 1 });
            }
        }

        layout.keys.forEach(([x, y], index) => {
            const button = document.createElement('button');
            const preview = document.createElement('img');
            button.type = 'button';
            button.className = 'key';
            button.id = `key-${index}`;
            button.title = `Update key ${index + 1}`;
            button.disabled = true;
            button.style.left = `${x / 842 * 100}%`;
            button.style.top = `${y / 981 * 100}%`;
            button.style.width = `${layout.key.width * 100}%`;
            button.style.height = `${layout.key.height * 100}%`;
            preview.id = `preview-${index}`;
            preview.alt = `Key ${index + 1} preview`;
            button.appendChild(preview);
            button.addEventListener('click', () => updateKey(index).catch((error) => setStatus(error.message, true)));
            device.appendChild(button);
            updateKey(index, 38 + index * 17, false);
        });

        layout.paging.forEach((rect, index) => {
            const element = document.getElementById(`key-${index + 9}`);
            for (const property of ['left', 'top', 'width', 'height']) {
                element.style[property] = `${rect[property] * 100}%`;
            }
        });

        client.on('status', ({ message, isError }) => setStatus(message, isError));
        client.on('keypadKeysChanged', ({ activeControlIds }) => {
            const currentPressed = new Set(activeControlIds.map((id) => controlIdToIndex.get(id)).filter(Number.isInteger));
            document.querySelectorAll('.key, .page-key').forEach((element) => {
                const index = Number(element.id.slice(4));
                element.classList.toggle('active', currentPressed.has(index));
            });
            for (const index of currentPressed) {
                if (!previousPressed.has(index)) setStatus(`Key down: ${index < 9 ? index + 1 : index === 9 ? 'PREV' : 'NEXT'}`);
            }
            previousPressed = currentPressed;
        });

        connectButton.addEventListener('click', async () => {
            try {
                connectButton.disabled = true;
                const devices = await client.requestDeviceAccessAndScan();
                const keypad = devices.find((entry) => entry.role === 'keypad');
                if (!keypad) throw new Error('No compatible keypad was selected.');
                await client.connectAvailableDevice(keypad.index);
                connected = true;
                document.querySelectorAll('.key').forEach((element) => { element.disabled = false; });
                setStatus(`Connected: ${keypad.friendlyName}\nSelect a display tile to upload a new color.`);
            } catch (error) {
                connectButton.disabled = false;
                setStatus(error.message, true);
            }
        });

        if (!('hid' in navigator)) {
            connectButton.disabled = true;
            setStatus('WebHID is unavailable. Open this page in Chrome, Edge, or Opera over HTTP or HTTPS.', true);
        } else {
            setStatus('Ready. Select Connect keypad to grant WebHID access.');
        }

        window.addEventListener('beforeunload', () => {
            if (connected) client.disconnectAll();
            for (const url of previewUrls.values()) URL.revokeObjectURL(url);
        });
    </script>
</body>
</html>
